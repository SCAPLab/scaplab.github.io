<!DOCTYPE html>
<html>
<head>
    {% include 'analytics.html' %}
<title>{{ data.website.title | striptags }} Shorten URLs</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta HTTP-EQUIV="REFRESH" content="10; url={{ url }}" />
<style type="text/css">
    html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    }
    #center {
    width: 400px;
    height: 400px;
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -200px 0 0 -200px;
    }
    .center-heading {
        text-align: center;
    }
    </style>
</head>
<body>
	<div id="center">
        <h1 class="center-heading"><a href='/'>{{ data.website.title | striptags }}</a> Shorten URLs</h1>

        <p>Move to <a href='{{ url }}'>{{ url }}</a> in ten seconds.</p>
        <p>Go to the page directly when you click the url.</p>
        <p><a href='{{ url }}'>{{ url }}</a></p>

	</div>
</body>
</html>
